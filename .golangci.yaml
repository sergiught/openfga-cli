version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - unconvert
    - unused
    - staticcheck
  settings:
    gosec:
      excludes:
        # G304 (file inclusion via variable) and G204 (subprocess launched with
        # a variable) describe what this tool *is*: it opens the config, model,
        # fixture and test files the user names on the command line or in
        # ofga.yaml, and it hands a file to the user's own $EDITOR and shells
        # out to git. Every path and command here is the operator's own input,
        # so there is no privilege boundary for the rule to protect. Excluded
        # globally rather than per-site so no future reader mistakes a silent
        # ignore for an oversight.
        - G304
        - G204
  exclusions:
    rules:
      # G101 (hardcoded credentials) fires only on test fixtures — literal
      # tokens and client secrets the tests must contain to assert on masking
      # and keyring handling. It stays enabled for production code, where a
      # hardcoded credential is exactly what this project wants flagged.
      #
      # G301/G302/G306 (directory and file permissions): in tests the mode *is*
      # the fixture: two tests write a 0644 file specifically to exercise the
      # permissive-secret-file warning (internal/readlimit and
      # internal/command/base), so tightening them would delete the assertion.
      # The rest stage throwaway trees under t.TempDir(). See below for the
      # production sites.
      #
      # G703/G710/G702 (path traversal, open redirect, command injection by
      # taint analysis) reach only test-controlled literals, a test's own
      # httptest server, or the re-exec-self idiom (exec.Command(os.Args[0],
      # "-test.run=…")) that a broken-pipe test needs.
      #
      # G122 wants os.Root instead of os.ReadFile inside a filepath.WalkDir
      # callback. The walks are over the repo's own testdata and generated docs,
      # where a symlink TOCTOU race has no attacker.
      - path: _test\.go
        linters:
          - gosec
        text: 'G101|G122|G301|G302|G306|G702|G703|G710'
      # G301/G302/G306 in production: the only files this tool writes that need
      # a restrictive mode are the config and the secrets in it, and
      # internal/config already writes those at 0600 under a 0700 dir
      # unconditionally — the rule stays enabled there. These five write
      # artifacts that exist to be read by something else: a JUnit report a
      # later CI step consumes (possibly as another UID), source files scaffolded
      # into the user's own repo, the generated command reference, and the
      # release-time shell completions and man pages that a packager copies into
      # /usr/share (where world-readable is the whole point). Narrowing them to
      # 0600/0700 to satisfy a rule aimed at credential files would be a silent
      # behaviour change for no security gain, so the modes stay at 0644/0755
      # and respect the caller's umask.
      - path: (internal/command/model/test_(cmd|init)|internal/command/playground/workbench|tools/(docgen|genassets)/main)\.go
        linters:
          - gosec
        text: 'G301|G302|G306'
      # G602 flags args[2] in requestBody, which is reached only inside an
      # `if len(args) == 3` guard that gosec's analysis does not model. A false
      # positive; scoped to the one file so the rule still runs everywhere else.
      - path: internal/command/api/command\.go
        linters:
          - gosec
        text: 'G602'

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
