version: "1"
rules:
  - name: connection.created
    when: input.type == "connection.created" || input.type == "snapshot.connection"
    iterator:
      source: input.data.object.enabled_clients
      as: client
      tuples:
        - user: "client:{{ fga_escape(client) }}"
          relation: "enabled_client"
          object: "connection:{{ input.data.object.id }}"
    tuples:
      - user: "tenant:{{ fga_escape(input.a0tenant) }}"
        relation: "tenant"
        object: "connection:{{ input.data.object.id }}"
  - name: user.created
    when: input.type == "user.created" || input.type == "snapshot.user"
    tuples:
      - user: "user:{{ fga_escape(input.data.object.user_id) }}"
        relation: "member"
        object: "tenant:{{ fga_escape(input.a0tenant) }}"
      - user: "user:{{ fga_escape(input.data.object.user_id) }}"
        relation: "assignee"
        object: "plan:{{ fga_escape(input.data.object.app_metadata.plan) }}"
        when: '"plan" in input.data.object.app_metadata'
  - name: organization.created
    when: input.type == "organization.created" || input.type == "snapshot.organization"
    tuples:
      - user: "tenant:{{ fga_escape(input.a0tenant) }}"
        relation: "tenant"
        object: "organization:{{ input.data.object.id }}"
  - name: organization.connection.added
    when: input.type == "organization.connection.added" || input.type == "snapshot.organization.connection"
    tuples:
      - user: "connection:{{ input.data.object.connection.id }}"
        relation: "connection"
        object: "organization:{{ input.data.object.organization.id }}"
        when: input.data.object.is_enabled
  - name: organization.member.added
    when: input.type == "organization.member.added" || input.type == "snapshot.organization.member"
    tuples:
      - user: "user:{{ fga_escape(input.data.object.user.user_id) }}"
        relation: "member"
        object: "organization:{{ input.data.object.organization.id }}"
      - user: "user:{{ fga_escape(input.data.object.user.user_id) }}"
        relation: "holder"
        object: "membership:{{ input.data.object.organization.id }}|{{ fga_escape(input.data.object.user.user_id) }}"
  - name: organization.member.role.assigned
    when: input.type == "organization.member.role.assigned" || input.type == "snapshot.organization.member.role"
    tuples:
      - user: "membership:{{ input.data.object.organization.id }}|{{ fga_escape(input.data.object.user.user_id) }}#holder"
        relation: "assignee"
        object: "role:{{ input.data.object.organization.id }}|{{ input.data.object.role.id }}"
