version: "1"
rules:
  - name: organization.member.added
    when: input.type == "organization.member.added"
    tuples:
      - user: "user:{{ fga_escape(input.data.object.user.user_id) }}"
        relation: "member"
        object: "organization:{{ input.data.object.organization.id }}"
      - user: "user:{{ fga_escape(input.data.object.user.user_id) }}"
        relation: "holder"
        object: "membership:{{ input.data.object.organization.id }}|{{ fga_escape(input.data.object.user.user_id) }}"
  - name: organization.member.deleted
    when: input.type == "organization.member.deleted"
    tuple_filters:
      - object: "organization:{{ input.data.object.organization.id }}"
        user: "user:{{ fga_escape(input.data.object.user.user_id) }}"
        relation: "member"
        action: delete
      - object: "membership:{{ input.data.object.organization.id }}|{{ fga_escape(input.data.object.user.user_id) }}"
        user: "user:{{ fga_escape(input.data.object.user.user_id) }}"
        relation: "holder"
        action: delete
      - object: "role:"
        user: "membership:{{ input.data.object.organization.id }}|{{ fga_escape(input.data.object.user.user_id) }}#holder"
        relation: "assignee"
        action: delete
  - name: organization.member.role.assigned
    when: input.type == "organization.member.role.assigned"
    tuples:
      - user: "membership:{{ input.data.object.organization.id }}|{{ fga_escape(input.data.object.user.user_id) }}#holder"
        relation: "assignee"
        object: "role:{{ input.data.object.organization.id }}|{{ input.data.object.role.id }}"
  - name: organization.member.role.deleted
    when: input.type == "organization.member.role.deleted"
    action: delete
    tuples:
      - user: "membership:{{ input.data.object.organization.id }}|{{ fga_escape(input.data.object.user.user_id) }}#holder"
        relation: "assignee"
        object: "role:{{ input.data.object.organization.id }}|{{ input.data.object.role.id }}"
tests:
  - name: organization.member.added
    input:
      a0stream: est_vjFVP5pVdfvsfRKatshkVV
      a0tenant: my-tenant
      data:
        context:
          tenant:
            id: my-tenant
        object:
          organization:
            id: org_1234567890abcdef
            name: my-organization
          user:
            user_id: auth0|507f1f77bcf86cd799439020
      id: evt_vjFVP5pVdfvsfRKatshkVV
      source: urn:auth0:example.auth0app.com
      specversion: "1.0"
      time: "2025-02-01T12:34:56Z"
      type: organization.member.added
    expect_tuples:
      - user: "user:auth0|507f1f77bcf86cd799439020"
        relation: "member"
        object: "organization:org_1234567890abcdef"
        action: write
      - user: "user:auth0|507f1f77bcf86cd799439020"
        relation: "holder"
        object: "membership:org_1234567890abcdef|auth0|507f1f77bcf86cd799439020"
        action: write
  - name: organization.member.deleted
    input:
      a0stream: est_vjFVP5pVdfvsfRKatshkVV
      a0tenant: my-tenant
      data:
        context:
          tenant:
            id: my-tenant
        object:
          organization:
            id: org_1234567890abcdef
            name: my-organization
          user:
