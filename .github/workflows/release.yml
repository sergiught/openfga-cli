name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GORELEASER_VERSION: 'v2.17.1'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. release-please opens/updates a release PR from Conventional Commits, and
  #    cuts the tag + GitHub release + CHANGELOG when that PR is merged.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Uses a PAT (RELEASE_PLEASE_TOKEN) when available so the release PR
      # triggers CI; falls back to the built-in GITHUB_TOKEN otherwise.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # 2. On a real release, build and publish artifacts and append them to the
  #    GitHub release release-please created.
  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release artifacts
      packages: write # push images to ghcr.io
      id-token: write # sign provenance with Sigstore
      attestations: write # publish provenance to GitHub
    # Mirror the optional Docker Hub secrets into env so steps can gate on their
    # presence (secrets can't be referenced from a step-level `if:` directly).
    # goreleaser also reads DOCKERHUB_TOKEN to decide whether to push docker.io.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: install Syft for release SBOMs
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.0
      - name: install cosign for keyless signing
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: log in to Docker Hub
        # Skipped when the Docker Hub secrets are unset, so a release still
        # succeeds (goreleaser then only pushes to GHCR).
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional publishers — skipped by .goreleaser.yaml when unset.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
      # goreleaser publishes AUR last, after the GitHub release, images, and tap
      # have all landed. An AUR outage there used to skip the attestation steps
      # below and ship a release with no provenance (v0.267.0, 2026-08-03), so
      # they run even when goreleaser failed. The job still reports failure —
      # goreleaser has no continue-on-error — and the checksums guard keeps them
      # from firing when goreleaser died before producing anything to attest.
      - name: attest release artifacts
        if: ${{ !cancelled() && hashFiles('dist/checksums.txt') != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-checksums: dist/checksums.txt
      # SBOM for the pushed container image, attached to it as a keyless cosign
      # attestation (`cosign verify-attestation --type spdxjson`). Targets the
      # GHCR manifest (always pushed); Docker Hub is an optional mirror.
      - name: attest SBOM for the container image
        if: ${{ !cancelled() && hashFiles('dist/checksums.txt') != '' }}
        env:
          IMAGE: ghcr.io/sergiught/openfga-cli
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          tag="${TAG_NAME#v}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{ .Manifest.Digest }}')"
          syft "${IMAGE}@${digest}" -o spdx-json=image.sbom.spdx.json
          cosign attest --yes --type spdxjson \
            --predicate image.sbom.spdx.json "${IMAGE}@${digest}"
