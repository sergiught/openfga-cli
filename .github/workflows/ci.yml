name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Kept in lockstep with release.yml so the config is validated against the same
# goreleaser that will publish it (renovate updates both together).
env:
  GORELEASER_VERSION: 'v2.17.1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: verify formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v '^vendor/'))
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: verify command reference is fresh
        run: |
          go run ./tools/docgen
          git diff --exit-code -- docs/site/src/content/docs/reference
      # The profiles e2e tests run the real binary, which stores secrets in the
      # OS keyring and refuses to fall back to plaintext. Headless runners have
      # no Secret Service, so provide gnome-keyring under a private D-Bus session.
      - name: install gnome-keyring for secret-store e2e tests
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring
      - name: test
        # OFGA_E2E_REQUIRE_KEYRING makes the keyring-backed e2e tests fail loudly
        # if this provisioned keyring ever stops working, rather than skipping.
        env:
          OFGA_E2E_REQUIRE_KEYRING: '1'
        run: |
          # Both vars must point at throwaway dirs, because this recipe gets
          # copy-pasted to reproduce CI locally and dbus-run-session isolates
          # only the bus. XDG_DATA_HOME is where gnome-keyring keeps the login
          # keyring; XDG_RUNTIME_DIR holds keyring/control, which --unlock uses
          # to reach an already-running daemon. Since `echo ""` leaves the
          # daemon believing the login password is a literal newline, an
          # unisolated run re-keys the developer's real login keyring to that
          # newline and their password stops unlocking it at every login.
          export XDG_DATA_HOME="$(mktemp -d)" XDG_RUNTIME_DIR="$(mktemp -d)"
          dbus-run-session -- bash -c '
            echo "" | gnome-keyring-daemon --unlock --components=secrets >/dev/null 2>&1
            go test -race ./...
          '

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # macOS is the second platform users install on, and it diverges where it
      # matters: the config lives under ~/Library/Application Support rather than
      # $XDG_CONFIG_HOME, and secrets go to the login keychain rather than the
      # Secret Service. Formatting, vet, tidiness and docs are platform-neutral
      # and stay in the ubuntu job; this one only builds and tests.
      - name: provision an unlocked keychain for secret-store e2e tests
        # The runner's login keychain is not guaranteed to be unlocked for a
        # non-GUI session, and a locked one makes `security add-generic-password`
        # fail with an interaction error. A throwaway keychain with no auto-lock
        # timeout, made the default and put on the search list, is the macOS
        # equivalent of the gnome-keyring session the ubuntu job starts.
        run: |
          security create-keychain -p '' ofga-ci.keychain
          security set-keychain-settings ofga-ci.keychain
          security unlock-keychain -p '' ofga-ci.keychain
          security list-keychains -d user -s ofga-ci.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s ofga-ci.keychain
      - name: test
        # As on ubuntu: fail loudly rather than skip if the provisioned keychain
        # ever stops working.
        env:
          OFGA_E2E_REQUIRE_KEYRING: '1'
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
      # Catches deprecated and invalid options in .goreleaser.yaml at PR time
      # rather than mid-release. `check` exits non-zero on deprecations, which
      # is the point: they used to only surface as warnings in a release log
      # nobody reads once the job is green.
      - name: validate the goreleaser config
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: check
